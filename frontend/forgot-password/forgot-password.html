<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>

    <form id="forgotForm">
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <p id="msg"></p>
</div>

<script src="forgot-password.js"></script>

</body>
</html>
